<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="32" y1="12" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Cyber Shield -->
  <path d="M32 4L54 12V28C54 42 44.5 53.5 32 58C19.5 53.5 10 42 10 28V12L32 4Z" 
        fill="#0a0f1d" 
        stroke="url(#shieldGrad)" 
        stroke-width="3" 
        stroke-linejoin="round" />

  <!-- Inner Radar / Circuit Grid -->
  <path d="M32 14L46 19.5V28C46 38 39.5 46.5 32 50C24.5 46.5 18 38 18 28V19.5L32 14Z" 
        fill="url(#glowGrad)" 
        opacity="0.15" />

  <!-- Security Checkmark & Core Circuit -->
  <path d="M24 30L29.5 35.5L40 23" 
        stroke="#38bdf8" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#cyberGlow)" />

  <!-- AI Pulse Nodes -->
  <circle cx="32" cy="14" r="2" fill="#38bdf8" />
  <circle cx="46" cy="28" r="2" fill="#818cf8" />
  <circle cx="18" cy="28" r="2" fill="#818cf8" />
  <circle cx="32" cy="50" r="2" fill="#38bdf8" />
</svg>